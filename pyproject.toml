[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscout"
version = "0.1.0"
description = "Local-first job search collector, deduplicator, and explainable job-fit scorer."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "jobscout contributors" }]
keywords = ["jobs", "sqlite", "local-first", "scoring"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# Runtime dependencies are intentionally minimal: the storage layer uses the
# standard library `sqlite3`, HTTP uses `urllib.request`, and the CLI uses
# `argparse`. PyYAML is only needed for YAML profile files; JSON profiles work
# with zero third-party dependencies.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
jobscout = "jobscout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The dashboard embeds these woff2 faces at render time, so they must ship with
# the package rather than living only in the source checkout.
[tool.setuptools.package-data]
jobscout = ["fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
